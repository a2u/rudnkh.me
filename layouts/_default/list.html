{{ partial "header.html" . }}
    <article>
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      {{ with .Pages.ByDate.Reverse }}
      <ul class="entries">
        {{ range . }}
        <li>
          <time>{{ if not .Date.IsZero }}{{ .Date.Format "2006-01-02" }}{{ end }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
      {{ end }}
    </article>
{{ partial "footer.html" . }}
