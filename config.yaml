baseurl: 'https://rudnkh.me'
title: 'Vitalii Rudnykh'
minify:
  minifyOutput: true
publishDir: 'docs'
permalinks:
  playing: /playing/:contentbasename/
  writeups: /writeups/:contentbasename/
sitemap:
  changefreq: daily
  filename: sitemap.xml
  priority: 0.5
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
          inline:
            - - $
              - $
params:
  cdn: '/images/'
